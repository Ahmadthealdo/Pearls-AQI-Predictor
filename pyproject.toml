[project]
name = "pearls-aqi-predictor"
version = "1.0.0"
description = "Production-grade MLOps system forecasting Air Quality Index (AQI) up to 72 hours using Open-Meteo and WAQI APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "10Pearls MLOps Team" }
]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
aqi = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
