version: "3.8"

services:
  aqi-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pearls_aqi_dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
